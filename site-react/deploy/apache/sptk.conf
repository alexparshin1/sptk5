<VirtualHost *:80>
    ServerName  sptk.net
    ServerAlias www.sptk.net xmq.sptk.net

    ServerAdmin alexeyp@gmail.com
    DocumentRoot /var/www/html/sptk

    <Directory /var/www/html/sptk>
        Options +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/sptk_error.log
    CustomLog ${APACHE_LOG_DIR}/sptk_access.log combined
RewriteEngine on
RewriteRule ^/?\.well-known/ - [L]
RewriteCond %{SERVER_NAME} =sptk.net [OR]
RewriteCond %{SERVER_NAME} =www.sptk.net [OR]
RewriteCond %{SERVER_NAME} =xmq.sptk.net
RewriteRule ^ https://xmq.sptk.net%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
