<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName  sptk.net
    ServerAlias www.sptk.net xmq.sptk.net
    RewriteEngine on
    RewriteCond %{HTTP_HOST} !^xmq\.sptk\.net$ [NC]
    RewriteRule ^ https://xmq.sptk.net%{REQUEST_URI} [END,NE,R=permanent]

    ServerAdmin alexeyp@gmail.com
    DocumentRoot /var/www/html/sptk

    <Directory /var/www/html/sptk>
        Options +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/sptk_error.log
    CustomLog ${APACHE_LOG_DIR}/sptk_access.log combined

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/sptk.net/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/sptk.net/privkey.pem
</VirtualHost>
</IfModule>
